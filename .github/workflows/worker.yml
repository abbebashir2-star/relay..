name: worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: cfat_99R1V9s4N2rfeAQi8H6KcsUA3osOUPrgNXxvCKKw4c97993b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: koll och deploy
        working-directory: worker
        run: |
          {
            echo "=== vem ar token ==="
            npx --yes wrangler@3 whoami
            echo
            echo "=== deploy ==="
            npx --yes wrangler@3 deploy
          } > ../logg.txt 2>&1 || true
          cat ../logg.txt

      - name: spara loggen
        run: |
          git config user.email "bot@local"
          git config user.name "bot"
          git add -f logg.txt
          git commit -m "deploylog" || true
          git push || true
