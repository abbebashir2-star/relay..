name: apk

on:
  push:
    branches: [main]
    paths: ["app/**", "*.gradle.kts", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: nyckel
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > app/keystore.jks
          else
            keytool -genkeypair -v -keystore app/keystore.jks \
              -alias relay -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=relay"
          fi

      - name: bygg
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
